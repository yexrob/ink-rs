[package]
name = "ink-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Build terminal user interfaces with components, in the spirit of Ink"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yexrob/ink-rs"
readme = "README.md"
keywords = ["tui", "terminal", "cli", "ink", "flexbox"]
categories = ["command-line-interface"]
exclude = ["/docs", "/CLAUDE.md", "/AGENTS.md", "/.gitignore"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[workspace]
members = ["macros"]

[features]
default = ["tokio", "macros"]
tokio = ["dep:tokio"]
macros = ["dep:ink-rs-macros"]

[dependencies]
ink-rs-macros = { path = "macros", version = "0.1.0", optional = true }
tokio = { version = "1.54", optional = true, default-features = false, features = ["rt", "sync", "time"] }
rustix = { version = "1", features = ["termios", "process"] }
filedescriptor = "0.8"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt", "sync", "time", "macros", "test-util"] }
portable-pty = "0.9"
vt100 = "0.16"

[[example]]
name = "jest"
required-features = ["tokio"]

[[example]]
name = "subprocess-output"
required-features = ["tokio"]

[[test]]
name = "pty"
harness = false

[[test]]
name = "examples_pty"
harness = false
