[package]
name = "ink-rs"
version = "0.1.0"
edition = "2024"
description = "Build terminal user interfaces with components, in the spirit of Ink"

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1.54", optional = true, default-features = false, features = ["rt", "sync", "time"] }
rustix = { version = "1", features = ["termios", "process"] }
filedescriptor = "0.8"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt", "sync", "time", "macros", "test-util"] }
portable-pty = "0.9"
vt100 = "0.16"

[[test]]
name = "pty"
harness = false
